{% extends "base.html" %}
{% block title %}Login | AI Job Copilot{% endblock %}
{% block content %}
<section class="auth-layout">
    <div class="auth-copy">
        <p class="eyebrow">Welcome back</p>
        <h1>Pick up where you left off.</h1>
        <p>Review jobs, run analysis, and keep follow-ups on track.</p>
    </div>
    <div class="panel form-panel">
        <h2>Login</h2>
        <form action="/auth/login" method="post" class="stack-form">
            <label>Email
                <input type="email" name="email" placeholder="you@example.com" required>
            </label>
            <label>Password
                <input type="password" name="password" placeholder="Your password" required>
            </label>
            <button type="submit" class="primary-button full-width">Login</button>
        </form>
        <a href="/auth/google" class="secondary-button full-width center">Continue with Google</a>
        <p class="muted center">No account yet? <a href="/auth/register">Create one</a></p>
    </div>
</section>
{% endblock %}
