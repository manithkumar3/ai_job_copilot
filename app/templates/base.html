<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Job Copilot{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="site-shell">
        <header class="topbar">
            <a href="/" class="brand">
                <span class="brand-mark">AJ</span>
                <span>
                    <strong>AI Job Copilot</strong>
                    <small>Track jobs. Tune resumes. Move faster.</small>
                </span>
            </a>

            <nav class="nav">
                {% if current_user %}
                    <a href="/dashboard" class="{% if active_path == '/dashboard' %}active{% endif %}">Dashboard</a>
                    <a href="/jobs" class="{% if active_path.startswith('/jobs') %}active{% endif %}">Jobs</a>
                    <a href="/resumes" class="{% if active_path.startswith('/resumes') %}active{% endif %}">Resumes</a>
                    <a href="/mock-interview" class="{% if active_path == '/mock-interview' %}active{% endif %}">Mock Interview</a>
                    <form action="/auth/logout" method="post">
                        <button type="submit" class="ghost-button">Logout</button>
                    </form>
                {% else %}
                    <a href="/auth/login">Login</a>
                    <a href="/mock-interview" class="{% if active_path == '/mock-interview' %}active{% endif %}">Upcoming</a>
                    <a href="/auth/register" class="ghost-button">Create account</a>
                {% endif %}
                <button type="button" class="theme-toggle" data-theme-toggle>Theme</button>
            </nav>
        </header>

        {% if flashes %}
            <div class="flash-stack">
                {% for flash in flashes %}
                    <div class="flash flash-{{ flash.category }}">{{ flash.message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <main class="page">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
